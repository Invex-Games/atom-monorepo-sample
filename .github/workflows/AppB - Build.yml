name: AppB - Build

on:
  push:
    branches: [ main ]
    paths:
      - src/AppB/**
      - src/Shared/**
      - global.json
      - Directory.Build.*
      - Directory.Packages.*
      - _atom/**
      - .github/workflows/**
      - .devops/workflows/**
  release:
    types: [ released ]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  PackAppB:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'appb/v')
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: PackAppB
        id: PackAppB
        run: dotnet run --project _atom/_atom.csproj -- PackAppB --skip --headless
        env:
          product: AppB

      - name: Store MonorepoSample.AppB
        uses: actions/upload-artifact@v7
        with:
          name: MonorepoSample.AppB
          path: '${{ github.workspace }}/.github/publish/MonorepoSample.AppB'

  ReleaseAppB:
    permissions:
      contents: write
    needs: [ PackAppB ]
    if: (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'appb/v')) && github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Retrieve MonorepoSample.AppB
        uses: actions/download-artifact@v8
        with:
          name: MonorepoSample.AppB
          path: '${{ github.workspace }}/.github/artifacts/MonorepoSample.AppB'

      - name: ReleaseAppB
        id: ReleaseAppB
        run: dotnet run --project _atom/_atom.csproj -- ReleaseAppB --skip --headless
        env:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          product: AppB

