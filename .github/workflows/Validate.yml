name: Validate

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  DetectAffectedProducts:
    runs-on: ubuntu-latest
    outputs:
      affected-products: ${{ steps.DetectAffectedProducts.outputs.affected-products }}
    steps:

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: DetectAffectedProducts
        id: DetectAffectedProducts
        run: dotnet run --project _atom/_atom.csproj -- DetectAffectedProducts --skip --headless

  ValidateBuild:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: ValidateBuild
        id: ValidateBuild
        run: dotnet run --project _atom/_atom.csproj -- ValidateBuild --skip --headless

  TestShared:
    needs: [ DetectAffectedProducts ]
    if: success() && contains(needs.DetectAffectedProducts.outputs.affected-products, ',shared,')
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: TestShared
        id: TestShared
        run: dotnet run --project _atom/_atom.csproj -- TestShared --skip --headless
        env:
          product: Shared

  TestAppA:
    needs: [ DetectAffectedProducts ]
    if: success() && contains(needs.DetectAffectedProducts.outputs.affected-products, ',appa,')
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: TestAppA
        id: TestAppA
        run: dotnet run --project _atom/_atom.csproj -- TestAppA --skip --headless
        env:
          product: AppA

  TestAppB:
    needs: [ DetectAffectedProducts ]
    if: success() && contains(needs.DetectAffectedProducts.outputs.affected-products, ',appb,')
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: TestAppB
        id: TestAppB
        run: dotnet run --project _atom/_atom.csproj -- TestAppB --skip --headless
        env:
          product: AppB

  ValidateGate:
    needs: [ ValidateBuild, TestShared, TestAppA, TestAppB ]
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: ValidateGate
        id: ValidateGate
        run: dotnet run --project _atom/_atom.csproj -- ValidateGate --skip --headless

